<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meu Treino</title>

<!-- PWA: instalável como app, tela cheia, sem barra de navegador -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#17161A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meu Treino" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --bg: #17161A; --panel: #211F25; --panelAlt: #2A2830; --line: #3A3742;
    --chalk: #F3EFE6; --muted: #9A94A6; --red: #FF4433; --redDim: #5C2620;
    --steel: #4C86B4; --plate: #E8B94A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--chalk); font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .display { font-family: 'Anton', 'Inter', sans-serif; letter-spacing: .03em; }
  input, textarea, button { font-family: inherit; }
  input, textarea { background: transparent; border: none; outline: none; color: var(--chalk); }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  .hidden { display: none !important; }
  #app { max-width: 900px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }

  /* portão de login */
  .gate { display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 16px; gap: 14px; text-align: center; }
  .gate input { width: 100%; max-width: 260px; background: var(--panel); border: 1px solid var(--line) !important;
    padding: 10px 12px; border-radius: 8px; font-size: 15px; }
  .gate button.primary { width: 100%; max-width: 260px; background: var(--red); color: #fff;
    padding: 10px; border-radius: 10px; font-size: 15px; margin-top: 4px; }
  .gate .error { color: var(--red); font-size: 13px; }
  .gate .switch { color: var(--muted); font-size: 13px; text-decoration: underline; margin-top: 6px; }

  /* topo */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .topbar .name { font-size: 24px; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px; }
  .logout { color: var(--muted); font-size: 14px; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }

  /* sidebar admin */
  .layout { display: flex; gap: 0; }
  .sidebar { width: 230px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line);
    padding: 16px; border-radius: 12px 0 0 12px; }
  .sidebar h1 { font-size: 20px; margin: 0 0 12px; }
  .client-row { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 4px; }
  .client-row.active { background: var(--redDim); border-color: var(--red); }
  .client-row .cn { font-size: 14px; font-weight: 600; }
  .client-row .ce { font-size: 11px; color: var(--muted); }
  .main { flex: 1; padding: 20px; background: var(--panel); border-radius: 0 12px 12px 0; }
  .main.solo { border-radius: 12px; }

  /* grade de treinos */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 12px; }
  .sq { aspect-ratio: 1/1; background: var(--panelAlt); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; position: relative; }
  .sq .rm { position: absolute; top: 8px; right: 8px; color: var(--muted); }
  .sq .title { font-size: 16px; }
  .sq .count { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sq.add { align-items: center; justify-content: center; border-style: dashed; color: var(--muted); }

  /* detalhe do treino */
  .day-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .back { border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 8px 14px; font-size: 15px; flex-shrink:0; }
  .day-title { flex: 1; font-size: 22px; }

  .ex-card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .ex-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ex-name { flex: 1; font-size: 16px; font-weight: 600; }
  .ex-toggle { color: var(--muted); font-size: 22px; flex-shrink: 0; transition: transform .15s ease; padding: 4px 8px; }
  .ex-toggle.collapsed { transform: rotate(-90deg); }
  .move-btns { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .move-btn { color: var(--muted); font-size: 11px; line-height: 1; padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; }
  .move-btn:disabled { opacity: .25; }
  .ex-body.hidden { display: none; }
  .notes-box { background: var(--panelAlt); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .notes-box label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .05em; display: block; margin-bottom: 5px; }
  .notes-box textarea { width: 100%; font-size: 15px; resize: none; line-height: 1.4; }

  .set-row { display: flex; align-items: center; gap: 6px; background: var(--panelAlt); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; flex-wrap: nowrap; justify-content: space-between; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .set-idx { font-size: 12px; color: var(--muted); width: 16px; flex-shrink: 0; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; position: relative; }
  .box { width: 42px; height: 38px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .box.kg { width: 48px; }
  .box.meta { width: 48px; }
  .box input { width: 100%; text-align: center; font-size: 16px; }
  .box input[readonly] { color: var(--muted); }
  .box.feito-open { color: var(--chalk); font-size: 16px; }
  .unit { font-size: 11px; color: var(--muted); white-space: nowrap; letter-spacing: .02em; line-height: 1; }
  .rm-x { color: var(--muted); flex-shrink: 0; font-size: 16px; padding: 4px; }

  .dashed-btn { border: 1px dashed var(--line); color: var(--muted); border-radius: 10px; padding: 9px 16px; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
  .cta { background: var(--red); color: #fff; border-radius: 10px; padding: 13px; font-size: 16px; width: 100%; }
  .muted-note { color: var(--muted); font-size: 14px; }
  .copy-btn { font-size: 12px; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 8px; }

  #install-banner { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.4); font-size: 13px; }
  #install-banner span { flex: 1; line-height: 1.4; }
  #install-banner button#ib-install { background: var(--red); color: #fff; border-radius: 8px; padding: 7px 12px; font-size: 13px; flex-shrink: 0; }
  #install-banner button#ib-dismiss { color: var(--muted); font-size: 16px; flex-shrink: 0; padding: 2px 4px; }

  /* bloco de rolagem (roleta) pro campo "feito" */
  #feito-picker.hidden { display: none; }
  #feito-picker { position: fixed; inset: 0; z-index: 70; }
  #feito-picker .fp-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.65); }
  #feito-picker .fp-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    width: 220px; max-width: 90vw; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  #feito-picker .fp-title { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  #feito-picker .fp-scroll { height: 220px; overflow-y: auto; scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  #feito-picker .fp-pad { height: 88px; }
  #feito-picker .fp-item { height: 44px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--chalk); scroll-snap-align: center; }
  #feito-picker .fp-item.selected { color: var(--red); font-weight: 700; font-size: 26px; }
  #feito-picker .fp-cancel { margin-top: 14px; color: var(--muted); font-size: 14px; padding: 6px 12px; }

  /* modal de importar treino (colar texto) */
  #import-modal.hidden { display: none; }
  #import-modal { position: fixed; inset: 0; z-index: 70; }
  #import-modal .im-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.65); }
  #import-modal .im-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    width: 92vw; max-width: 520px; max-height: 85vh; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); }
  #import-modal .im-title { font-size: 17px; font-weight: 700; }
  #import-modal .im-hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
  #import-modal textarea#im-text { flex: 1; min-height: 220px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font-size: 13px; color: var(--chalk); resize: vertical; font-family: monospace; line-height: 1.4; }
  #import-modal .im-actions { display: flex; justify-content: flex-end; gap: 10px; }
  #import-modal .im-btn-secondary { color: var(--muted); padding: 9px 16px; font-size: 14px; }
  #import-modal .im-btn-primary { background: var(--red); color: #fff; border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 600; }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; border-radius: 12px 12px 0 0; border-right: none; border-bottom: 1px solid var(--line); }
    .main { border-radius: 0 0 12px 12px; }
  }
</style>
</head>
<body>
  <div id="app">
    <p style="text-align:center;color:#9A94A6;padding-top:60px;">Carregando…</p>
  </div>
  <div id="install-banner" class="hidden"></div>
  <div id="feito-picker" class="hidden"></div>
  <div id="import-modal" class="hidden">
    <div class="im-backdrop" id="im-backdrop"></div>
    <div class="im-card">
      <div class="im-title">Importar treino (colar texto)</div>
      <p class="im-hint">Cole o texto do treino no formato de dias da semana, nomes de exercício e linhas com "1x10-12r 20kg". Isso <b>adiciona</b> novos treinos sem apagar os que já existem.</p>
      <textarea id="im-text" placeholder="Segunda-feira (...)&#10;Nome do exercício&#10;-8r 10kg&#10;1x9-12r 26kg&#10;..."></textarea>
      <div id="im-error" class="error" style="font-size:12px;"></div>
      <div class="im-actions">
        <button id="im-cancel" class="im-btn-secondary">Cancelar</button>
        <button id="im-confirm" class="im-btn-primary">Importar</button>
      </div>
    </div>
  </div>

  <!-- Firebase (SDK compat, sem precisar de bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
